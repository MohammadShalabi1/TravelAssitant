version: "3.9"

services:
  # ── PostgreSQL (local dev) ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB:       travel_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (local dev) ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:    postgresql://agent:agentpass@db:5432/travel_agent
      REDIS_URL:       redis://redis:6379/0
      GEMINI_API_KEY:  ${GEMINI_API_KEY}
      JWT_SECRET:      ${JWT_SECRET}
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs     # mount logs out of container
    restart: unless-stopped

volumes:
  pgdata: